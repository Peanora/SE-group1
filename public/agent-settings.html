<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
  <title>Agent 角色 · Taskflow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%235135aa'/%3E%3Crect x='17' y='9' width='12' height='12' rx='3' fill='%237866bb'/%3E%3Crect x='7' y='19' width='12' height='12' rx='3' fill='%23b7a9df'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/workbench-theme.css"><link rel="stylesheet" href="/agent-settings.css">
  <script type="module" src="/agent-settings.js"></script>
</head>
<body class="agent-settings-page tf-product" data-settings-page="agents">
  <a class="skip-link" href="#agent-settings-main">跳到 Agent 角色</a>
  <aside class="settings-sidebar" aria-label="工作台导航">
    <a class="settings-brand" href="/" aria-label="Taskflow 工作台首页"><span class="tf-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><strong>Taskflow</strong></a>
    <p class="settings-nav-label">工作空间</p>
    <nav class="settings-navigation">
      <a href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>项目工作台</a>
      <a href="/agent-settings.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M8 12h.01M16 12h.01M8 16h8"/></svg>Agent 角色</a>
      <a href="/api-settings.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7 3 12l5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>API 服务</a>
    </nav>
    <div class="settings-sidebar-foot"><span></span>本地工作空间</div>
  </aside>
  <div class="settings-shell">
    <header class="settings-topbar"><span>工作台 <b aria-hidden="true">/</b> <strong>Agent 角色</strong></span><a href="/">返回项目</a></header>
    <main id="agent-settings-main" class="settings-main">
      <div class="settings-heading"><div><h1>Agent 角色</h1><p>为每个研发角色选择合适的模型服务。</p></div></div>
      <p id="agent-settings-error" class="settings-message settings-error" role="alert" hidden></p>
      <p id="agent-settings-notice" class="settings-message" role="status">正在读取配置…</p>
      <form id="agent-settings-form" class="settings-paper" hidden>
        <div class="settings-paper-heading"><div><h2>角色分工</h2><p>按职责分配服务，可复用同一模型。</p></div><a class="settings-inline-link" href="/api-settings.html">管理 API 服务</a></div>
        <div class="settings-environment"><span class="settings-status-dot" aria-hidden="true"></span><span>环境默认</span><strong id="environment-status">正在核对服务端配置</strong></div>
        <fieldset id="agent-settings-fields" class="settings-fields"><legend class="visually-hidden">选择各 Agent 调用的 API 服务</legend><div class="settings-role-columns" aria-hidden="true"><span>角色与职责</span><span>调用服务 / 模型</span></div><div id="agent-role-bindings"></div></fieldset>
        <footer class="settings-save"><div><p id="agent-settings-save-state">配置已载入</p><small>开发执行保留启动时配置；规划按每次新调用取配置。</small></div><button id="save-agent-settings" type="submit" class="button button-primary">保存并应用</button></footer>
      </form>
      <div class="settings-page-note"><p>角色沿用现有流程的职责和权限；测试定义仍须确认，软件通过仍以独立验收为准。</p><button id="reload-agent-settings" type="button" class="text-button">重新载入配置</button><span>将替换本页尚未保存的修改</span></div>
    </main>
  </div>
</body>
</html>
